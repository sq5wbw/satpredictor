<script>
// stopka: rozwinięty panel (Satelity / Dane TLE) zwija się sam, gdy użytkownik przewinie stronę z powrotem do góry
// i ramka zakładek zniknie pod dolną krawędzią ekranu. Panel otwarty z zapamiętanego stanu nie zwija się,
// dopóki użytkownik go choć raz nie zobaczy.
(function autoCollapsePanel() {
  const box = document.querySelector('.fbox'), panes = $('fpanes');
  let seen = false, raf = 0;
  const check = () => {
    raf = 0;
    if (!panes.classList.contains('open')) { seen = false; return; }
    const top = box.getBoundingClientRect().top;
    if (top < innerHeight) seen = true;
    else if (seen) { seen = false; setPanel(''); }
  };
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(check); }, { passive: true });
  for (const id of ['tab-sats', 'tab-tle']) $(id).addEventListener('click', () => requestAnimationFrame(check));
})();

// kolor paska przeglądarki (meta theme-color) płynnie podąża za kolorem strony podczas zmiany motywu.
// Strona przy zmianie motywu przemalowuje się z opóźnieniem ok. 4–6 klatek (pomiar z nagrania telefonu),
// a pasek przeglądarki zmienia się natychmiast – dlatego pasek dostaje kolor tła sprzed BAR_LAG ms.
(function syncBrowserBar() {
  const html = document.documentElement, BAR_LAG = 80;
  const metas = () => document.querySelectorAll('meta[name="theme-color"]');
  let raf = 0, hist = [], endT = 0;
  const now = () => performance.now();
  const paper = () => getComputedStyle(html).getPropertyValue('--paper').trim();
  const set = c => { if (c) for (const m of metas()) if (m.getAttribute('content') !== c) m.setAttribute('content', c); };
  const loop = () => {
    const t = now();
    hist.push([t, paper()]);
    let c = hist[0][1];
    for (const [ht, hc] of hist) if (ht <= t - BAR_LAG) c = hc; else break;
    set(c);
    const animating = html.classList.contains('theme-anim');
    if (animating) endT = 0; else if (!endT) endT = t;
    if (animating || t - endT < BAR_LAG + 20) raf = requestAnimationFrame(loop);
    else { raf = 0; hist = []; set(paper()); }
  };
  new MutationObserver(() => {
    if (html.classList.contains('theme-anim') && !raf) {
      const start = getComputedStyle(html).getPropertyValue('--paper').trim();
      hist = [[now() - BAR_LAG, start]]; set(start); endT = 0;
      raf = requestAnimationFrame(loop);
    }
  }).observe(html, { attributes: true, attributeFilter: ['class'] });
})();

// zamykanie ekranu startowego „kaskadą” – spójne z wejściem: elementy znikają kolejno od góry do dołu,
// lekko opadając, a na końcu wygasa tło. Ponowne otwarcie w trakcie zamykania przerywa animację.
(function staggeredClose() {
  const w = $('welcome');
  let anims = [], run = 0;
  const cancel = () => { run++; anims.forEach(a => a.cancel()); anims = []; w.style.pointerEvents = ''; };
  const open0 = openWelcome;
  // otwarcie w trakcie zamykania: ekran na moment znika, żeby kaskada wejścia zagrała od początku
  openWelcome = function (...args) { const was = anims.length > 0; cancel(); if (was) { w.hidden = true; void w.offsetWidth; } return open0.apply(this, args); };
  closeWelcome = function () {
    document.body.style.overflow = '';
    if (reduceMotion() || w.classList.contains('gps-done')) { cancel(); w.hidden = true; return; }
    cancel();
    const id = run;
    const items = [w.querySelector('.w-top'), ...w.querySelector('.w-card').children, w.querySelector('.w-copy')];
    const STEP = 35, DUR = 260, n = items.length, total = (n - 1) * STEP + DUR;
    w.style.pointerEvents = 'none';                       // strona pod spodem od razu reaguje
    // górny pasek (krzyżyk, motyw, język) tylko wygasa – bez ruchu, tak samo jak przy wejściu; reszta lekko opada
    items.forEach((el, i) => anims.push(el.animate(
      (el.classList.contains('w-top') || el.classList.contains('w-input')) ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 1, translate: '0 0' }, { opacity: 0, translate: '0 10px' }],
      { duration: DUR, delay: i * STEP, easing: 'cubic-bezier(.4, 0, 1, 1)', fill: 'forwards' })));
    const bg = w.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, delay: total - 260, easing: 'ease-in', fill: 'forwards' });
    anims.push(bg);
    bg.onfinish = () => { if (id !== run) return; w.hidden = true; cancel(); };
  };
})();

// nakładka ładowania: widoczna od wczytania strony i za każdym razem, gdy lista pokazuje „ładuję…”.
// Zostaje co najmniej BOOT_MIN ms (kilka obrotów animacji), potem płynnie znika i odsłania listę –
// koniec z mignięciem, gdy dane są gotowe po ułamku sekundy.
(function bootLoader() {
  const boot = $('boot'), msg = $('bootMsg'), list = $('list'), BOOT_MIN = 3000, FADE = 350;
  let shownAt = 0, t1 = 0, t2 = 0;                      // 0 = od początku wczytywania strony
  const show = html => {
    clearTimeout(t1); clearTimeout(t2);
    if (html && msg.innerHTML !== html) msg.innerHTML = html;
    if (!boot.classList.contains('show') || boot.hidden) { boot.hidden = false; void boot.offsetWidth; boot.classList.add('show'); shownAt = performance.now(); }
  };
  // gdy nakładka znika, lista wchodzi kaskadą jak ekran startowy: nagłówki kolumn, kolejne przeloty,
  // przycisk „pokaż kolejne”, pasek ISS i stopka – każdy element 40 ms po poprzednim, każdy 520 ms
  const cascade = () => {
    if (reduceMotion()) return;
    const els = [list.querySelector(':scope > .cols'), ...list.querySelectorAll(':scope > .row, :scope > .empty'), $('more'), $('ticker'),
                 document.querySelector('footer .fbox'), document.querySelector('footer .copy')]
      .filter(el => el && !el.hidden && el.getClientRects().length);
    els.forEach((el, i) => el.animate([{ opacity: 0, translate: '0 12px' }, { opacity: 1, translate: '0 0' }],
      { duration: 520, delay: Math.min(i, 14) * 40, easing: 'cubic-bezier(.2, .7, .2, 1)', fill: 'backwards' }));
  };
  const hide = () => {
    if (!boot.classList.contains('show')) return;
    clearTimeout(t1); clearTimeout(t2);
    t1 = setTimeout(() => { cascade(); boot.classList.remove('show'); t2 = setTimeout(() => { boot.hidden = true; }, FADE); },
                    Math.max(0, shownAt + BOOT_MIN - performance.now()));
  };
  const welcome = $('welcome');
  const sync = () => {
    if (!welcome.hidden) {                               // ekran startowy na wierzchu: nakładka niepotrzebna
      clearTimeout(t1); clearTimeout(t2); boot.classList.remove('show'); boot.hidden = true;
      return;
    }
    const l = list.querySelector(':scope > .empty.loading'); l ? show(l.innerHTML) : hide();
  };
  new MutationObserver(sync).observe(list, { childList: true });
  new MutationObserver(sync).observe(welcome, { attributes: true, attributeFilter: ['hidden'] });
  // pokazanie na żądanie (po GPS): zostaje co najmniej BOOT_MIN, potem znika jak zwykle, chyba że lista dalej się ładuje
  window.showBoot = html => { show(html); requestAnimationFrame(() => { if (!list.querySelector(':scope > .empty.loading')) hide(); }); };
  sync();
})();

// panel „Satellites”: satelity wchodzą i wychodzą kaskadą, tak jak elementy ekranu startowego.
// Opóźnienie liczone wg wiersza na ekranie (obie kolumny w tym samym wierszu ruszają razem).
(function satsCascade() {
  const pane = $('pan-sats'), EASE_IN = 'cubic-bezier(.2, .7, .2, 1)', EASE_OUT = 'cubic-bezier(.4, 0, 1, 1)';
  let anims = [], timer = 0;
  const stop = () => { clearTimeout(timer); timer = 0; anims.forEach(a => a.cancel()); anims = []; };
  const items = () => {
    const chips = [...pane.querySelectorAll('.satchip')], tops = [...new Set(chips.map(c => c.offsetTop))].sort((a, b) => a - b);
    const out = chips.map(c => [c, tops.indexOf(c.offsetTop)]);
    const bulk = pane.querySelector('.satbulk'); if (bulk) out.push([bulk, tops.length]);
    return out;
  };
  const open0 = setPanel;
  setPanel = function (name) {
    const wasSats = !pane.hidden && $('fpanes').classList.contains('open');
    if (!name && timer) {                               // drugie kliknięcie w trakcie zamykania = rozmyślenie się: panel zostaje
      stop();
      for (const [el] of items()) anims.push(el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: EASE_IN }));
      return;
    }
    stop();
    if (reduceMotion()) return open0(name);
    if (!name && wasSats) {                               // zamykanie: od góry do dołu, lekkie opadanie, potem zwinięcie panelu
      for (const [el, row] of items()) anims.push(el.animate([{ opacity: 1, translate: '0 0' }, { opacity: 0, translate: '0 10px' }],
        { duration: 200, delay: row * 12, easing: EASE_OUT, fill: 'forwards' }));
      timer = setTimeout(() => { timer = 0; open0(''); setTimeout(() => { if (!timer) { anims.forEach(a => a.cancel()); anims = []; } }, 340); }, 180);
      return;
    }
    open0(name);
    if (name === 'pan-sats' && !wasSats) {              // otwieranie: od góry, wysunięcie od dołu
      for (const [el, row] of items()) anims.push(el.animate([{ opacity: 0, translate: '0 12px' }, { opacity: 1, translate: '0 0' }],
        { duration: 520, delay: 60 + row * 25, easing: EASE_IN, fill: 'backwards' }));
    }
  };
})();

// stany strony jako klasy (zamiast selektorów :has() na całej stronie, które w Safari/Chrome na iPadzie
// przeliczały style całego dokumentu przy każdej zmianie odliczania i psuły płynność animacji)
(function stateClasses() {
  const list = $('list'), gps = $('wGps');
  const syncList = () => {
    list.classList.toggle('is-empty', !!list.querySelector(':scope > .empty'));
    list.classList.toggle('has-cols', !!list.querySelector(':scope > .cols'));

  };

  new MutationObserver(syncList).observe(list, { childList: true });

  syncList(); syncGps();
})();

// puls wokół kropki satelity na wykresie: animacja SMIL (działa we wszystkich przeglądarkach, także WebKit na iPadzie)
(function haloPulse() {
  // SMIL tylko w WebKicie (Safari, wszystkie przeglądarki na iPadzie/iPhonie), gdzie animacja CSS na SVG nie działa.
  // W Chrome/Edge/Firefoksie zostaje animacja CSS – SMIL powodował tam miganie kursora myszy nad stroną.
  const ua = navigator.userAgent;
  const webkit = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ||
                 (/AppleWebKit/.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua));
  if (!webkit) return;
  document.documentElement.classList.add('smil-halo');
  const NS = 'http://www.w3.org/2000/svg';
  const add = () => {
    for (const h of document.querySelectorAll('svg.polar .halo:not([data-smil])')) {
      h.setAttribute('data-smil', '');
      const r0 = +h.getAttribute('r') || 8;
      for (const [attr, values] of [['r', `${r0 * .6};${r0 * 2.1};${r0 * 2.1}`], ['opacity', '.9;0;0']]) {
        const a = document.createElementNS(NS, 'animate');
        a.setAttribute('attributeName', attr); a.setAttribute('values', values); a.setAttribute('keyTimes', '0;.7;1');
        a.setAttribute('calcMode', 'spline'); a.setAttribute('keySplines', '.2 .6 .3 1;0 0 1 1');
        a.setAttribute('dur', '1.8s'); a.setAttribute('repeatCount', 'indefinite');
        h.appendChild(a);
        if (a.beginElement) try { a.beginElement(); } catch (e) {}
      }
    }
  };
  new MutationObserver(add).observe($('list'), { childList: true, subtree: true });
  add();
})();

// ekran startowy: krzyżyk zawsze widoczny (układ górnego paska się nie przesuwa). Bez lokatora nie zamyka
// ekranu – tylko drga jak zablokowany filtr. Po GPS ekran znika natychmiast (klasa gps-done), bez animacji.
(function welcomeClose() {
  const x = $('wClose'), w = $('welcome');
  const sync = () => x.setAttribute('aria-disabled', String(x.hidden));
  new MutationObserver(sync).observe(x, { attributes: true, attributeFilter: ['hidden'] });
  sync();
  x.addEventListener('click', () => { if (x.hidden) nope(x); }, true);
  new MutationObserver(() => { if (w.hidden) w.classList.remove('gps-done'); }).observe(w, { attributes: true, attributeFilter: ['hidden'] });
})();

// suwak min el na ekranach dotykowych: przesuwanie palcem z dowolnego miejsca paska (Safari/Chrome na iPadzie
// przesuwa natywnie tylko wtedy, gdy palec trafi dokładnie w niewidoczny uchwyt)
(function sliderTouch() {
  const sl = $('minel'), THUMB = 14;
  let id = null;
  const setFromX = x => {
    const r = sl.getBoundingClientRect(), min = +sl.min, max = +sl.max;
    const p = Math.min(1, Math.max(0, (x - r.left - THUMB / 2) / (r.width - THUMB)));
    const v = Math.round(min + p * (max - min));
    if (+sl.value !== v) { sl.value = String(v); sl.dispatchEvent(new Event('input', { bubbles: true })); }
  };
  sl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    id = e.pointerId; try { sl.setPointerCapture(id); } catch (err) {}
    setFromX(e.clientX);
  });
  sl.addEventListener('pointermove', e => { if (e.pointerId === id) setFromX(e.clientX); });
  const end = e => { if (e.pointerId === id) id = null; };
  sl.addEventListener('pointerup', end); sl.addEventListener('pointercancel', end);
})();

// ---------- dostrajanie SDR++ (korekta Dopplera) – tylko komputer ----------
// Strona łączy się z mostkiem sdrpp-bridge.py (ws://127.0.0.1:4533), a mostek z serwerem Rigctl SDR++ (port 4532).
// Po kliknięciu „Tune” strona liczy z góry przebieg prędkości radialnej satelity dla całego przelotu
// i wysyła go mostkowi – dalej korektę prowadzi mostek, więc działa też przy zakładce w tle czy zmniejszonym oknie.
// Przed AOS mostek czeka, o LOS kończy. Transponder liniowy: kliknięcie QSO na wodospadzie SDR++ = nowa stacja.
(function sdrTune() {
  const BRIDGE = 'ws://127.0.0.1:4533', TOL = 30;
  // komputer = mysz / gładzik z kursorem; iPad z klawiaturą też to zgłasza, więc wykluczamy go osobno
  const isIPad = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
  const capable = () => matchMedia('(hover: hover) and (pointer: fine)').matches && !isIPad && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  const L = () => lang === 'pl' ? { tune: 'Dostrój', tuning: 'Dostrajam' } : { tune: 'Tune', tuning: 'Tuning' };
  let ws = null, retryT = 0, bridgeUp = false, rigUp = false, tuning = null;   // tuning: { sat, start, end, state }

  const parseDown = txt => {
    const m = String(txt || '').match(/(\d{2,4})\.(\d+)(?:\s*-\s*(\d+(?:\.\d+)?))?/);
    if (!m) return null;
    const a = parseFloat(`${m[1]}.${m[2]}`);
    if (!m[3]) return { f: Math.round(a * 1e6), linear: false };
    const b = m[3].includes('.') ? parseFloat(m[3]) : parseFloat(`${m[1]}.${m[2].slice(0, m[2].length - m[3].length)}${m[3]}`);
    return { f: Math.round((a + b) / 2 * 1e6), linear: true };
  };
  const rangeAt = (satrec, t) => {
    const pv = satellite.propagate(satrec, new Date(t));
    if (!pv || !pv.position || typeof pv.position === 'boolean') return null;
    return satellite.ecfToLookAngles(observer, satellite.eciToEcf(pv.position, satellite.gstime(new Date(t)))).rangeSat;
  };
  // prędkość radialna [km/s] co 1 s od AOS do LOS (dodatnia = satelita się oddala)
  const samples = (satrec, start, end) => {
    const out = [];
    for (let t = Math.floor(start / 1000) * 1000; t <= end + 1000; t += 1000) {
      const a = rangeAt(satrec, t - 500), b = rangeAt(satrec, t + 500);
      if (a != null && b != null) out.push([t, +(b - a).toFixed(5)]);
    }
    return out;
  };

  const send = obj => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; } return false; };
  const connect = () => {
    clearTimeout(retryT);
    if (ws || !capable()) return;
    try { ws = new WebSocket(BRIDGE); } catch (e) { ws = null; retryT = setTimeout(connect, 5000); return; }
    ws.onopen = () => { bridgeUp = true; send({ type: 'hello', app: 'SAT Predictor', version: 2 }); paint(); };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === 'status') { rigUp = !!m.rig; if ('tuning' in m) tuning = m.tuning || null; paint(); }
      else if (m.type === 'tuning') { tuning = m.tuning || null; paint(); }
    };
    ws.onclose = () => { ws = null; bridgeUp = false; rigUp = false; tuning = null; paint(); retryT = setTimeout(connect, document.hidden ? 15000 : 5000); };
    ws.onerror = () => {};
  };

  const tune = p => {
    const r = satrecs.find(x => x.sat === p.sat), d = parseDown(p.sat.down);
    if (!r || !d || !observer) return false;
    tuning = { sat: p.sat.name, start: p.start, end: p.end, state: Date.now() < p.start ? 'waiting' : 'active' };
    send({ type: 'tune', sat: p.sat.name, f0: d.f, linear: d.linear, start: p.start, end: p.end,
           aos: hhmm(p.start), los: hhmm(p.end), samples: samples(r.satrec, p.start, p.end) });
    paint();
    return true;
  };
  const untune = () => { send({ type: 'untune' }); tuning = null; paint(); };
  const isMine = (b, t) => !!t && t.sat === b.dataset.sat && Math.abs(t.start - +b.dataset.start) < 120000;

  // przyciski i podpowiedź obok nich
  function paint() {
    document.body.classList.toggle('sdr-cap', capable());
    document.body.classList.toggle('sdr-on', bridgeUp && rigUp);
    for (const b of document.querySelectorAll('.follow-btn')) {
      const on = isMine(b, tuning), info = b.parentElement.querySelector('.fl-info');
      const txt = `${on ? L().tuning : L().tune} ${b.dataset.sat}`, t = b.querySelector('.fl-t');
      if (t.textContent !== txt) t.textContent = txt;
      if (b.classList.contains('on') !== on) b.classList.toggle('on', on);
      const waiting = on && tuning.state === 'waiting';
      if (b.classList.contains('waiting') !== waiting) b.classList.toggle('waiting', waiting);
      if (b.getAttribute('aria-pressed') !== String(on)) b.setAttribute('aria-pressed', String(on));
      const early = Date.now() < +b.dataset.start;               // przed AOS dostrajanie jest niedostępne
      const msg = !bridgeUp ? T('sdrNeedBridge') : !rigUp ? T('sdrNeedRig') : (early && !on) ? T('sdrWaitAos').replace('{t}', hhmm(+b.dataset.start)) : '';
      if (info.textContent !== msg) info.textContent = msg;
      const dis = !(bridgeUp && rigUp);
      if (b.getAttribute('aria-disabled') !== String(dis)) b.setAttribute('aria-disabled', String(dis));
    }
  }
  const rowOf = det => { for (const e of rowEls.values()) if (e.det === det) return e; return null; };
  const addButtons = () => {
    if (!capable()) return;
    let added = false;
    for (const det of document.querySelectorAll('.det')) {
      const col = det.querySelector('.det-grid > div:first-child');
      if (!col || col.querySelector('.follow')) continue;
      const e = rowOf(det); if (!e || !parseDown(e.p.sat.down)) continue;
      const wrap = document.createElement('div');
      wrap.className = 'follow';
      wrap.innerHTML = `<div><button type="button" class="follow-btn" data-sat="${esc(e.p.sat.name)}" data-start="${e.p.start}"><span class="fl-t"></span><span class="fl-ring" aria-hidden="true"></span></button><span class="fl-info" aria-live="polite"></span></div>`;
      wrap.querySelector('button').addEventListener('click', ev => {
        ev.stopPropagation();
        const b = ev.currentTarget;
        if (isMine(b, tuning)) { untune(); return; }
        const now = Date.now();
        if (!(bridgeUp && rigUp) || now < e.p.start || now >= e.p.end || !tune(e.p)) nope(b);   // bez mostka, przed AOS, po LOS: tylko drgnięcie
      });
      col.querySelector('dl.freq').after(wrap);
      added = true;
    }
    if (added) paint();
  };
  new MutationObserver(addButtons).observe($('list'), { childList: true, subtree: true });
  matchMedia('(hover: hover) and (pointer: fine)').addEventListener('change', () => { paint(); if (capable()) { addButtons(); connect(); } else if (ws) ws.close(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !ws) connect(); });
  for (const b of document.querySelectorAll('.lang button')) b.addEventListener('click', () => setTimeout(paint, 0));
  setInterval(() => { if (tuning || document.querySelector('.follow-btn')) paint(); }, 2000);   // napis „od AOS” znika sam o AOS
  paint(); addButtons(); connect();
})();

// strzałki przy bieżącym położeniu satelity (el ↑/↓, az →/←): kierunek idzie z tekstu do atrybutu,
// bo w CSS strzałki są rysowane wektorowo (tekst jest ukryty) i bez tego zawsze wskazywały ↑ i →
(function liveArrows() {
  const mark = () => {
    for (const a of document.querySelectorAll('.livepos .earr')) {
      const d = a.textContent.trim();
      if (a.dataset.d !== d) a.dataset.d = d;
    }
  };
  new MutationObserver(mark).observe($('list'), { childList: true, subtree: true });
  mark();
})();

// logo w nagłówku otwiera ekran startowy (tak samo jak pole Grid)
$('home').addEventListener('click', () => openWelcome(true));

// krótkie „zaprzeczenie” ruchem: przycisk drga w poziomie, gdy kliknięcie nic nie zmieni
const nope = el => { if (!reduceMotion()) el.animate([{ transform: 'none' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(-2px)' }, { transform: 'none' }], { duration: 320, easing: 'ease-in-out' }); };
// filtry SSB / FM / DIG: nie można wyłączyć ostatniego aktywnego – pusta lista nie ma sensu.
// Zdarzenie jest zatrzymywane, zanim dotrze do przycisku; przycisk tylko krótko „odmawia” ruchem.
(function keepOneMode() {
  const seg = document.querySelector('.seg');
  seg.addEventListener('click', e => {
    const b = e.target.closest('.flt'); if (!b) return;
    const on = [...seg.querySelectorAll('.flt')].filter(x => x.getAttribute('aria-pressed') === 'true');
    if (on.length === 1 && on[0] === b) {
      e.stopPropagation(); e.preventDefault();
      nope(b);
    }
  }, true);
  // zapamiętany stan bez żadnej emisji (z wcześniejszej wersji strony): włącz wszystkie
  if (!filter.FM && !filter.SSB && !filter.DIG) { filter = { FM: true, SSB: true, DIG: true }; store.set('filter', JSON.stringify(filter)); setLocatorUI(); draw(); }
})();

// lista satelitów: nie można odznaczyć ostatniego zaznaczonego – lista przelotów nigdy nie jest pusta
(function keepOneSat() {
  const grid = $('satgrid');
  grid.addEventListener('click', e => {
    const b = e.target.closest('.satchip'); if (!b) return;
    const on = grid.querySelectorAll('.satchip[aria-pressed="true"]');
    if (on.length === 1 && on[0] === b) { e.stopPropagation(); e.preventDefault(); nope(b); }
  }, true);
  // zapamiętany stan bez żadnego satelity (z wcześniejszej wersji strony): zaznacz wszystkie
  const fix = () => {
    if (grid.children.length && !grid.querySelector('.satchip[aria-pressed="true"]')) {
      satOff.clear(); store.set('sats_off', '[]'); renderSatGrid(); draw();
    }
  };
  new MutationObserver(fix).observe(grid, { childList: true, subtree: true, attributes: true, attributeFilter: ['aria-pressed'] });
  fix();
})();
</script>
</body>
