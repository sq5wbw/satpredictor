<style>
  /* Paleta inspirowana mapą nawigacyjną: blady papier, granatowy tusz,
     niebieski tor przelotu i magenta dla tego, co dzieje się teraz. */
  :root {
    color-scheme: light;
    --paper:   #eef1ee;
    --surface: #f8faf8;
    --ink:     #172630;
    --muted:   #5b6d71;
    --rule:    #cbd5d2;
    --track:   #1d5c8f;
    --plot:    #dab7c9;   /* próba: kolor toru przelotu na wykresie */
    --tick:    #a6206a;
    --horizon: #9aa9a7;   /* jaśniejszy obrys – większy kontrast z fioletowymi napisami */
    --live:    #a6206a;
    --live-bg: #f6e3ec;
    --hover:   #e4eae7;
    --pulse:   #ffffff;
    --pastel:  #dab7c9;   /* „niewypełniona” część suwaka i paska postępu */
    --sans: "Recursive", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* tryb ciemny: z systemu (gdy użytkownik nie wybrał inaczej) albo wymuszony przyciskiem słońce/księżyc */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:   #121b20;
      --surface: #18242a;
      --ink:     #b3bfbc;   /* przygaszony, żeby w nocy ekran mniej świecił */
      --muted:   #7c8d90;
      --rule:    #2d3c42;
      --track:   #7ab5e6;
      --plot:    #55666c;   /* tor przelotu w trybie ciemnym: stonowana szarość zamiast jasnego fioletu */
      --tick:    #55666c;   /* w nocy: kółka, tor i obrys tarczy w jednym kolorze */
      --horizon: #36454b;
      --live:    #a6206a;
      --live-bg: #1c282e;   /* w trybie ciemnym neutralne tło komunikatów */
      --hover:   #1d2b32;
      --pulse:   #1d2b32;   /* jak tło rozwiniętego wiersza */
      --pastel:  #3b4b52;   /* w trybie ciemnym ciemnoszary zamiast przygaszonego fioletu */
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:   #121b20;
    --surface: #18242a;
    --ink:     #b3bfbc;
    --muted:   #7c8d90;
    --rule:    #2d3c42;
    --track:   #7ab5e6;
    --plot:    #55666c;
    --tick:    #55666c;
    --horizon: #36454b;
    --live:    #a6206a;
    --live-bg: #1c282e;   /* w trybie ciemnym neutralne tło komunikatów */
    --hover:   #1d2b32;
    --pulse:   #1d2b32;   /* jak tło rozwiniętego wiersza */
      --pastel:  #3b4b52;   /* w trybie ciemnym ciemnoszary zamiast przygaszonego fioletu */
  }
  /* płynne przejście motywu: kolory są zarejestrowanymi zmiennymi, więc przechodzą płynnie
     wszędzie naraz – w tekstach, tłach, gradientach suwaka i paska postępu, w SVG i w animacjach */
  @property --paper { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --surface { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --ink { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --muted { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --rule { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --track { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --plot { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --tick { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --horizon { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --live { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --live-bg { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --hover { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --pulse { syntax: '<color>'; inherits: true; initial-value: transparent; }
  @property --pastel { syntax: '<color>'; inherits: true; initial-value: transparent; }
  html.theme-anim { transition: --paper .6s cubic-bezier(.4, 0, .2, 1), --surface .6s cubic-bezier(.4, 0, .2, 1), --ink .6s cubic-bezier(.4, 0, .2, 1), --muted .6s cubic-bezier(.4, 0, .2, 1), --rule .6s cubic-bezier(.4, 0, .2, 1), --track .6s cubic-bezier(.4, 0, .2, 1), --plot .6s cubic-bezier(.4, 0, .2, 1), --tick .6s cubic-bezier(.4, 0, .2, 1), --horizon .6s cubic-bezier(.4, 0, .2, 1), --live .6s cubic-bezier(.4, 0, .2, 1), --live-bg .6s cubic-bezier(.4, 0, .2, 1), --hover .6s cubic-bezier(.4, 0, .2, 1), --pulse .6s cubic-bezier(.4, 0, .2, 1), --pastel .6s cubic-bezier(.4, 0, .2, 1); }
  /* w trakcie zmiany motywu elementy nie dokładają własnych przejść kolorów (inaczej „gonią” zmienne i zostają w tyle) */
  html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after { transition-property: none !important; }
  html.theme-anim .theme .ic-half { transition-property: transform !important; }   /* obrót ikony ◐ zostaje */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }   /* manipulation: bez powiększania podwójnym stuknięciem (przesuwanie i powiększanie dwoma palcami zostają) */   /* bez niebieskiego „podświetlenia stuknięcia” na Androidzie – aplikacja ma własne reakcje na dotyk */
  html, body { margin: 0; background: var(--paper); color: var(--ink); touch-action: manipulation; }
  button, a, label, input, .row, .seg, .switch, #minel { touch-action: manipulation; }   /* szybkie stuknięcia bez powiększania (kompas ma własne ustawienia) */
  body {
    font: 15px/22px var(--sans);
    font-variation-settings: "MONO" 0, "CASL" 0;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }
  .num, .mono { font-variation-settings: "MONO" 1, "CASL" 0; font-variant-numeric: tabular-nums; }
  a { color: var(--track); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  button, label.btn { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--track); outline-offset: 2px; border-radius: 3px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 24px 48px; }

  /* ---------- nagłówek ---------- */
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; padding-bottom: 18px; }
  /* logo nie zaznacza się jak zwykły tekst (stuknięcie / przytrzymanie na telefonie) */
  /* logotyp (SVG od projektanta): kolory z motywu, wysokość w pełnych pikselach, szerokość z proporcji */
  svg.logo { display: block; height: 30px; width: auto; overflow: visible; }   /* komputer: większe logo – na ekranach o zwykłej gęstości wektor wygląda ostrzej */
  svg.logo .lg-ink { fill: var(--ink); }
  svg.logo .lg-mark { fill: var(--live); }
  .w-logo svg.logo { height: round(down, calc(min(360px, 100vw - 40px) / 7.84), 1px); margin: 0 auto; }
  h1, .w-logo { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: default; }
  h1 .mark { color: var(--live); font-weight: 700; margin-left: -.04em; }
  h1 { margin: 0; font-size: 26px; line-height: 30px; font-weight: 650; letter-spacing: -0.01em; }
  .where { margin: 12px 0 0; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }   /* ten sam odstęp co „Auto-rotate” → przełącznik */
  .loc { border: 1px solid var(--rule); background: var(--surface); border-radius: 4px; padding: 1px 7px; cursor: pointer; color: var(--ink); font-weight: 600; }
  .loc { transition: border-color .15s ease; }
  .loc:hover { border-color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  /* suwak minimalnej elewacji: mocny fiolet do kropki, pastelowy dalej (jak pasek postępu przelotu) */
  .elrow { display: flex; align-items: center; gap: 12px; order: -1; }
  .elval { position: relative; top: -2px; color: var(--muted); font-size: 13px; line-height: 20px; white-space: nowrap; cursor: pointer; }
  .elval b { color: var(--ink); font-weight: 650; display: inline-block; min-width: 3ch; text-align: right; }
  /* suwak bez gałki: sam pasek, który płynnie grubieje po najechaniu i podczas przeciągania */
  #minel { -webkit-appearance: none; appearance: none; width: 224px; height: 26px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; --pct: 0%; }
  #minel:focus-visible { outline: none; }
  #minel::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; transition: height .25s cubic-bezier(.2, .7, .2, 1);
    background: linear-gradient(to right, var(--live) var(--pct), var(--pastel) var(--pct)); }
  #minel::-moz-range-track { height: 4px; border-radius: 999px; transition: height .25s cubic-bezier(.2, .7, .2, 1);
    background: linear-gradient(to right, var(--live) var(--pct), var(--pastel) var(--pct)); }
  #minel::-moz-range-progress { background: transparent; }
  #minel::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 26px; margin-top: -11px; background: transparent; border: 0; box-shadow: none; }
  #minel::-moz-range-thumb { width: 14px; height: 26px; background: transparent; border: 0; box-shadow: none; }
  @media (hover: hover) {
    #minel:hover::-webkit-slider-runnable-track { height: 8px; }
    #minel:hover::-moz-range-track { height: 8px; }
    #minel:hover::-webkit-slider-thumb { margin-top: -9px; }
  }
  #minel.held::-webkit-slider-runnable-track, #minel:focus-visible::-webkit-slider-runnable-track { height: 8px; }
  #minel.held::-moz-range-track, #minel:focus-visible::-moz-range-track { height: 8px; }
  #minel.held::-webkit-slider-thumb, #minel:focus-visible::-webkit-slider-thumb { margin-top: -9px; }
  /* „pokaż kolejne” pod listą */
  /* „pokaż kolejne” jak „czytaj dalej”: kolejny przelot widać tuż pod listą, wygaszony gradientem do tła,
     a przycisk (jak na ekranie startowym) leży na tym wygaszeniu i co kilka sekund delikatnie zjeżdża w dół */
  /* --shift: jedna animowana wartość dla przycisku i gradientu – gradient „jedzie” za przyciskiem i odsłania więcej */
  @property --shift { syntax: '<length>'; inherits: true; initial-value: 0px; }
  .more { position: relative; display: flex; flex-direction: column; align-items: center; padding-bottom: 26px; animation: peekshift 8s infinite; }
  .peek { align-self: stretch; height: 76px; overflow: hidden; pointer-events: none; user-select: none;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.55) 0, rgba(0,0,0,.3) calc(var(--shift) + 4px), transparent calc(var(--shift) * 1.6 + 10px));
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.55) 0, rgba(0,0,0,.3) calc(var(--shift) + 4px), transparent calc(var(--shift) * 1.6 + 10px)); }
  .peek .row { border-bottom: 0; }
  .morebtn { position: relative; z-index: 1; width: 100%; max-width: 360px; margin-top: calc(var(--tagoff, 12px) - 76px); transform: translateY(var(--shift)); }   /* górna krawędź = górna krawędź etykiety (FM) ukrytego przelotu */
  /* spokojny, „oddychający” ruch co 8 s: łagodne zejście, krótka pauza, wolniejszy powrót */
  @keyframes peekshift {
    0%, 68% { --shift: 0px; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
    82% { --shift: 22px; animation-timing-function: linear; }
    87% { --shift: 22px; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
    100% { --shift: 0px; }
  }
  /* najechanie / zaznaczenie: zamiast zamrozić przycisk w połowie ruchu, płynnie wraca na miejsce i czeka */
  .more.hold { animation: none; transition: --shift .45s cubic-bezier(.37, 0, .63, 1); }
  /* odkrywanie kolejnego przelotu – na razie wyłączone (wygląd przycisku zostaje) */
  .more { animation: none !important; padding-bottom: 0; }
  .peek { display: none; }
  .morebtn { margin-top: 18px; transform: none; }
  @media (prefers-reduced-motion: reduce) { .more { animation: none; } }
  .morebtn { border: 1px solid var(--live); background: var(--live); border-radius: 4px; padding: 12px 16px; cursor: pointer; color: #fff; font-weight: 650; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; transition: background-color .15s ease, border-color .15s ease; }
  /* licznik w przycisku: co kilka sekund „nalicza się” od 1 – każda cyfra wjeżdża z góry i wygasa w dół */
  .morebtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 20px; }
  .mb-label, .mb-unit { line-height: 20px; }
  .mb-num { display: inline-flex; letter-spacing: 0; line-height: 20px; }   /* ta sama wysokość linii co napis obok – cyfry stoją równo z literami */
  .mb-d { position: relative; display: block; overflow: hidden; width: 1ch; height: 20px; line-height: 20px; }   /* jedno okienko na cyfrę, jak w liczniku mechanicznym */
  .mb-d > span { position: absolute; left: 0; top: 0; width: 1ch; text-align: center; }
  @media (hover: hover) { .morebtn:hover { background: color-mix(in srgb, var(--live) 85%, #000); border-color: color-mix(in srgb, var(--live) 85%, #000); } }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 6px 13px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; line-height: 20px; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  @media (hover: hover) { .seg button:hover:not([aria-pressed="true"]) { color: var(--ink); } }
  .tog { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; line-height: 22px; }   /* jak „Grid” */
  .tog label { cursor: pointer; }
  /* przełącznik: stały rozmiar, gałka przesuwa się w prawo po włączeniu */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; padding: 0; border: 1px solid var(--rule); border-radius: 999px; background: var(--rule); cursor: pointer; transition: background-color .2s ease, border-color .2s ease; }
  /* gałka przełącznika N°: biała tarcza + szara połówka (zawsze szara, także po włączeniu);
     przesuw i obrót mają ten sam czas i krzywą, więc połówka wraca do zera razem z ruchem gałki */
  .switch::after, .switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    translate: 0 0; rotate: var(--krot, 0deg); transition: translate .2s cubic-bezier(.2, .7, .2, 1), rotate .2s cubic-bezier(.2, .7, .2, 1); }
  .switch::after { background: var(--surface); }
  .switch::before { z-index: 1; background: var(--rule); -webkit-mask: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22%3E%3Cpath d=%22M10 3a7 7 0 0 1 0 14Z%22/%3E%3C/svg%3E") center / 20px 20px no-repeat; mask: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22%3E%3Cpath d=%22M10 3a7 7 0 0 1 0 14Z%22/%3E%3C/svg%3E") center / 20px 20px no-repeat; }
  .switch[aria-checked="true"] { background: var(--live); border-color: var(--live); }
  .switch[aria-checked="true"]::after, .switch[aria-checked="true"]::before { translate: 18px 0; }
  .switch.live::after, .switch.live::before { transition: translate .2s cubic-bezier(.2, .7, .2, 1); }   /* gałka jako igła kompasu: obrót bez opóźnienia, w każdej klatce */
  @media (prefers-reduced-motion: reduce) { .switch, .switch::after, .switch::before { transition: none; } }

  /* ---------- lista przelotów ---------- */
  .list { margin-top: 18px; position: relative; }
  .cols, .row {
    display: grid;
    grid-template-columns: 46px minmax(110px, 236px) minmax(64px, 1fr) minmax(70px, 1fr) minmax(90px, 1.2fr) minmax(56px, .8fr) minmax(220px, 2fr);
    column-gap: 14px; align-items: baseline;
    padding: 9px 12px;
  }
  .cols { color: var(--muted); font-size: 12px; line-height: 18px; padding-top: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .cols .r, .row .r { text-align: right; }
  .row { position: relative; cursor: pointer; border-bottom: 1px solid var(--rule); border-radius: 0; }
  /* hover jako nakładka z płynnym zanikaniem – działa też na pulsujących wierszach */
  .row::after { content: ""; position: absolute; inset: 0; background: var(--hover); opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  @media (hover: hover) { .row:hover::after { opacity: 1; transition-duration: .15s; } }
  .row > *, .row .info > * { position: relative; z-index: 1; }
  .row[aria-expanded="true"] { background: var(--hover); border-bottom-color: transparent; }
  .row.leaving { pointer-events: none; }
  /* przelot w trakcie: tło zwiniętego wiersza delikatnie pulsuje */
  .row.on[aria-expanded="false"] { animation: rowpulse 1.2s ease-in-out infinite alternate; }
  @keyframes rowpulse {
    from { background-color: transparent; }
    to   { background-color: var(--pulse); }
  }
  /* pasek postępu przelotu: pełny magentowy przy wschodzie, „wypala się” do pastelowego przy zachodzie */
  @property --left { syntax: '<number>'; inherits: true; initial-value: 1; }
  .row.on { transition: background-color .2s ease, --left 1s linear; }
  .row.on::before { content: ""; z-index: 2; position: absolute; left: 0; top: 6px; bottom: 6px; width: 4px; border-radius: 999px;
    background: linear-gradient(to top, var(--live) calc(var(--left, 1) * 100%), var(--pastel) calc(var(--left, 1) * 100%)); }
  /* etykieta emisji: jasna dla nadchodzących przelotów, ciemna dla satelity nad horyzontem */
  .mode { font-size: 12px; font-weight: 650; color: var(--muted); background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; justify-self: start; line-height: 18px;
          transition: color .5s ease, background-color .5s ease, border-color .5s ease; }
  .row.on .mode { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  .name { font-weight: 650; }
  /* linijka „↓ el 8° az 285°”: płynnie się rozsuwa przy wschodzie i zwija przy zachodzie */
  .name .livepos { display: block; overflow: hidden; max-height: 0; opacity: 0; transform: translateY(-3px); font-weight: 600; font-size: 13px; line-height: 18px; color: var(--live);
    transition: max-height .45s cubic-bezier(.2, .7, .2, 1), opacity .35s ease, transform .45s cubic-bezier(.2, .7, .2, 1); }
  .name .livepos.show { max-height: 18px; opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .name .livepos { transition: none; } }
  .eta.on { color: var(--live); font-weight: 650; }
  /* odliczanie: ten sam krój co nazwa satelity, cyfry o stałej szerokości, dwukropek pulsuje co sekundę jak w zegarze */
  .eta { font-weight: 650; font-variant-numeric: tabular-nums; display: inline-block; }
  /* jak w zegarku LCD: pół sekundy widoczny, pół sekundy schowany – z krótkim (0,1 s) przejściem zamiast ostrego cięcia */
  .eta .ec { display: inline-block; animation: colonblink 1s linear infinite; }
  @keyframes colonblink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .eta .ec { animation: none; } }
  .el b { font-weight: 650; }
  .az { color: var(--muted); white-space: nowrap; }
  .lbl { display: none; }

  /* ---------- szczegóły przelotu ---------- */
  /* rozwijanie: wysokość animowana przez grid 0fr → 1fr, treść lekko wjeżdża i się rozjaśnia */
  .det { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.2, .7, .2, 1); }
  .det.open { grid-template-rows: 1fr; }
  .det-clip { overflow: hidden; min-height: 0; }
  .det-in { background: var(--surface); border-bottom: 1px solid var(--rule); padding: 6px 12px 16px;
            opacity: 0; transform: translateY(-6px); transition: opacity .22s ease, transform .32s cubic-bezier(.2, .7, .2, 1); }
  .det.open .det-in { opacity: 1; transform: none; transition-delay: .05s; }
  .row { transition: background-color .2s ease; }
  .reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.2, .7, .2, 1); }
  .reveal.open { grid-template-rows: 1fr; }
  .reveal > div { overflow: hidden; min-height: 0; }
  .reveal #satlist { opacity: 0; transition: opacity .22s ease; }
  .reveal.open #satlist { opacity: 1; transition-delay: .05s; }
  @media (prefers-reduced-motion: reduce) {
    .det, .det-in, .reveal, .reveal #satlist, .row, .row::after, .mode { transition: none !important; }
    #minel::-webkit-slider-runnable-track { transition: none; }
    #minel::-moz-range-track { transition: none; }
    .row.on[aria-expanded="false"] { animation: none; background-color: var(--pulse); }
    svg.polar .halo { animation: none; }
  }
  .det-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 8px 32px; align-items: start; }
  .times { display: grid; grid-template-columns: repeat(3, max-content); gap: 4px 28px; margin: 6px 0 16px; }
  .times div span { display: block; color: var(--muted); font-size: 12px; line-height: 18px; text-transform: uppercase; letter-spacing: .02em; }
  .times div strong { font-size: 18px; line-height: 27px; font-weight: 600; }
  .times div em { font-style: normal; color: var(--muted); font-size: 12px; line-height: 18px; margin-left: 6px; }
  .tarrow { display: none; }
  dl.freq { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 5px 14px; margin: 0; }
  dl.freq dt { color: var(--muted); font-size: 13px; line-height: 20px; padding-top: 1px; }
  dl.freq dd { margin: 0; }
  dl.freq dd.note { color: var(--muted); }
  .start .tarr { color: var(--muted); margin-right: 0; font-weight: 400; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }   /* ten sam krój co strzałki → w azymutach (systemowy) */
  .livepos .earr.vert { margin-right: 0; }   /* ↑/↓ mają węższy znak – ten sam odstęp optyczny co → / ← */
  .livepos .earr { margin-right: 2px; font-weight: 400; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }   /* test: strzałki jak w linijce pod spodem */   /* ten sam odstęp strzałka → liczba co przy godzinie */
  /* azymut: → rośnie (obracaj się w prawo), ← maleje (w lewo); obrócona strzałka ↑, żeby krój był identyczny */
  .livepos .aarr { display: inline-block; }
  .livepos .aarr.cw { transform: rotate(90deg); }
  .livepos .aarr.ccw { transform: translateX(.12em) rotate(-90deg); }   /* korekta optyczna: obrócony grot ląduje 1,5 px dalej w lewo */   /* ↑ wschód (AOS) / ↓ zachód (LOS) */
  .tle { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; line-height: 18px; }
  .tle a { color: var(--live); font-weight: 600; }

  /* ---------- wykres nieba ---------- */
  figure.plot { margin: 0; }
  /* podpis w prawym górnym rogu wykresu („Rotation: 96°”) – pojawia się i znika płynnie */
  figure.plot { position: relative; }
  /* poziomica (przy włączonym Auto-rotate): szara podstawa + fioletowa kulka; w poziomie kulka zmienia się w pierścień */
  figure.plot .level { position: absolute; top: var(--lv-top, 1px); right: 0; width: 30px; height: 30px; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  figure.plot .level.on { opacity: 1; }
  .level .lv-base { fill: var(--rule); }
  .level .lv-ball { fill: var(--live); transition: fill-opacity .25s ease; }
  .level .lv-ring { fill: none; stroke: var(--live); stroke-width: 1.6; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .25s ease; }
  .level.flat .lv-ring { opacity: 1; }
  .level .lv-cut { fill: var(--surface); }
  .level.flat .lv-ball { fill-opacity: 0; }
  /* w poziomie: fioletowy pierścień z pustym środkiem (kolor tła) */
  svg.polar { overflow: visible; width: 100%; max-width: 320px; height: auto; display: block; touch-action: pan-y pinch-zoom; user-select: none; -webkit-user-select: none; margin: 0 auto; }
  svg.polar .hit { cursor: grab; }   /* obracać można tylko tarczę, pole wokół przewija stronę */
  svg.polar.dragging, svg.polar.dragging .hit { cursor: grabbing; }
  body.compass-on svg.polar .hit { cursor: default; }
  svg.polar text { font-family: var(--sans); font-variation-settings: "MONO" 1; font-size: 10px; fill: var(--muted); }
  svg.polar .disc { fill: var(--paper); }
  /* grubość linii w pikselach ekranu, niezależnie od rozmiaru wykresu (telefon = komputer) */
  svg.polar .grid, svg.polar .horizon, svg.polar .track, svg.polar .tick, svg.polar .halo { vector-effect: non-scaling-stroke; }
  svg.polar .grid { fill: none; stroke: var(--rule); stroke-width: 1; }
  svg.polar .horizon { fill: none; stroke: var(--horizon); stroke-width: 1.2; }
  svg.polar .card { fill: var(--ink); font-size: 12px; font-weight: 700; font-variation-settings: "MONO" 0; }
  svg.polar .ring { font-size: 8.5px; }
  svg.polar .track { fill: none; stroke: var(--plot); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  svg.polar .tick { fill: var(--surface); stroke: var(--plot); stroke-width: 2.2; }   /* kółka AOS / Max / LOS: kolor i grubość jak tor, wielkość jak kropka satelity */
  svg.polar .tlabel, svg.polar .ring, svg.polar .card { transition: opacity .45s cubic-bezier(.4, 0, .2, 1); }
  svg.polar .tlabel { fill: var(--ink); font-weight: 600; }   /* godziny w kolorze tekstu (#172630 w trybie jasnym) */
  svg.polar .halo { fill: var(--live); fill-opacity: .3; stroke: var(--live); stroke-width: 1.2; stroke-opacity: .7; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s cubic-bezier(.2, .6, .3, 1) infinite; }
  @keyframes pulse {
    0%   { transform: scale(.6); opacity: .9; }
    70%  { transform: scale(2.1); opacity: 0; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  svg.polar .satdot { fill: var(--live); }
  svg.polar .satname { fill: var(--live); font-weight: 700; font-variation-settings: "MONO" 0; font-size: 11px; }
  svg.polar .info { fill: var(--ink); }

  /* ---------- stopka ---------- */
  footer.data { margin-top: 28px; color: var(--muted); font-size: 14px; line-height: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* przyciski stopki w stylu pola „Grid” */
  .actions button, .actions a, .actions label.btn { display: inline-block; border: 1px solid var(--rule); background: var(--surface); border-radius: 4px; padding: 4px 10px; cursor: pointer; color: var(--ink); font-weight: 600; font-size: 13px; line-height: 18px; text-decoration: none; transition: border-color .15s ease; }
  .actions button:hover, .actions a:hover, .actions label.btn:hover { border-color: var(--muted); text-decoration: none; }
  .linkbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); font-weight: 600; font-size: 14px; }
  .linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
  .notice a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .copyrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 28px; }
  .copy { margin: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
  /* przełącznik języka: sam tekst, aktywny język pogrubiony */
  .lang { display: inline-flex; align-items: center; font-size: 12px; line-height: 18px; }
  .lang button { background: none; border: 0; padding: 2px 6px; cursor: pointer; color: var(--muted); font-weight: 500; letter-spacing: .02em; transition: color .15s ease; }
  .lang button + button { border-left: 1px solid var(--rule); }
  .lang button:hover { color: var(--ink); }
  .lang button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
  header.top { position: relative; }
  .tools-top { position: absolute; top: -6px; right: -6px; display: flex; align-items: center; gap: 4px; }
  /* przycisk motywu: koło podzielone na pół, monochromatyczne */
  .theme { width: 34px; height: 34px; padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .theme svg { overflow: visible; }
  /* ikona: koło podzielone na pół – przy zmianie motywu obraca się o 180°, wypełniona połowa przechodzi na drugą stronę */
  .theme .ic-half { transform-box: view-box; transform-origin: 12px 12px; transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
  html.is-dark .theme .ic-half { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .theme .ic-half { transition: none; } }
  @media (hover: hover) { .theme:hover { background: var(--hover); } }
  .theme-m { display: none; }
  .theme-w { display: inline-flex; margin-right: 4px; }
  .lang-foot { display: none; }
  .notice { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--live); background: var(--live-bg); color: var(--ink); border-radius: 0 4px 4px 0; }
  .notice p { margin: 0 0 4px; }
  .notice ol { margin: 4px 0 0; padding-left: 20px; }
  .satbox { margin-top: 18px; }
  .satbox .linkbtn { color: var(--ink); }
  #satlist { margin-top: 8px; margin-bottom: 2px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: 80ch; }
  #satlist a { white-space: nowrap; font-weight: 500; color: var(--ink); }
  #satlist a:hover { text-decoration: underline; text-underline-offset: 2px; }
  #satlist a.missing { color: var(--muted); }
  .empty { padding: 18px 12px; color: var(--muted); }
  .empty.loading { animation: ldpulse 1.4s ease-in-out infinite alternate; }
  @keyframes ldpulse { from { opacity: .45; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .empty.loading { animation: none; } }

  /* ---------- ekran powitalny: najpierw własny grid ---------- */
  .welcome { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; flex-direction: column; align-items: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; overflow-x: hidden; }
  /* górny pasek i copyright przy krawędziach (20 px), blok z logo i gridem wyśrodkowany pomiędzy nimi */
  .w-top { width: 100%; max-width: 360px; display: flex; justify-content: flex-end; align-items: center; gap: 6px; min-height: 34px; flex: none; }
  .w-top .w-close { order: -1; margin-right: auto; margin-left: -8px; }
  .w-card { width: 100%; max-width: 360px; margin: auto 0; padding: 28px 0; display: flex; flex-direction: column; align-items: stretch; }
  .w-copy { flex: none; margin: 0; font-size: 12px; line-height: 16px; color: var(--muted); text-align: center; }
  .w-close { width: 34px; height: 34px; border: 0; background: none; border-radius: 50%; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; }
  @media (hover: hover) { .w-close:hover { color: var(--ink); background: var(--hover); } }
  .lang-w { display: inline-flex; margin-right: -6px; }
  .w-logo { margin: 0; font-size: round(down, calc(min(360px, 100vw - 40px) / 7.14), 1px); line-height: round(calc(min(360px, 100vw - 40px) / 7.14 * 1.1), 1px); letter-spacing: -0.01em; text-align: center; white-space: nowrap; }   /* zawsze jedna linia – na wąskich ekranach logo się zmniejsza */
  /* cytat: kursywa Recursive, autor w kolorze akcentu; kolejne cytaty płynnie się zmieniają */
  .w-quote { margin: 26px 0 34px; text-align: center; position: relative; }
  .w-quote blockquote { margin: 0; font-size: round(down, calc(min(360px, 100vw - 40px) / 17.78), 1px); line-height: round(calc(min(360px, 100vw - 40px) / 17.78 * 1.4), 1px);  color: var(--muted); font-variation-settings: "MONO" 0, "CASL" 0, "slnt" -15, "CRSV" 1; font-style: oblique 15deg; }
  .w-quote cite { font-style: normal; font-variation-settings: "MONO" 0, "CASL" 0, "slnt" 0; color: var(--live); white-space: nowrap; }
  .w-quote .wq-q { font-style: inherit; }
  .w-label { color: var(--ink); font-weight: 600; font-size: 14px; line-height: 20px; margin-bottom: 12px; }   /* jak „Use my location (GPS)” */
  .w-input { width: 100%; font: 600 32px/38px var(--sans); font-variation-settings: "MONO" 1; letter-spacing: .02em; text-align: center; text-transform: uppercase;
    padding: 14px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); transition: border-color .2s ease; }
  .w-input::placeholder { color: var(--rule); }
  @media (hover: hover) { .w-input:hover { border-color: var(--muted); } }
  .w-input:focus { outline: none; border-color: var(--live); box-shadow: 0 0 0 1px var(--live); }   /* 2 px wizualnie, bez zmiany układu */
  .w-hint { margin: 12px 0 36px; min-height: 20px; font-size: 13px; line-height: 20px; color: var(--muted); text-align: center; }
  .w-hint.err { color: var(--live); }
  .w-go { border: 1px solid var(--live); background: var(--live); color: #fff; border-radius: 4px; padding: 12px 16px; font-weight: 650; font-size: 14px; line-height: 20px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  @media (hover: hover) { .w-go:hover { background: color-mix(in srgb, var(--live) 85%, #000); } }
  .w-gps { margin-top: 28px; align-self: center; border: 0; background: none; padding: 6px; color: var(--ink); font-weight: 600; font-size: 14px; line-height: 20px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); cursor: pointer; }
  .w-gps:disabled { color: var(--muted); cursor: default; }

  /* ---------- telefon ---------- */
  @media (max-width: 720px) {
    /* wariant B: wspólna linia treści 20 px od krawędzi (jak na ekranie startowym); tła wierszy i linie – na całą szerokość */
    .wrap { padding: 23px 0 40px; }   /* logo 20 px od górnej krawędzi – jak górny pasek na ekranie startowym */
    header.top { padding-left: 20px; padding-right: 20px; }
    .more, footer.data { padding-left: 20px; padding-right: 20px; }
    .list > .empty { padding-left: 20px; padding-right: 20px; }
    .row.on::before { left: 8px; }   /* pasek postępu QRV odsunięty od krawędzi ekranu, 8 px przed etykietą */
    h1 { line-height: 0; }
    .where { margin-top: 6px; }   /* telefon: bez zmian */
    header.top h1, header.top .where { position: relative; top: -4px; }   /* logo + Grid 4 px wyżej, reszta nagłówka bez zmian */
    h1 svg.logo { height: round(down, min(24px, calc((100vw - 160px) / 7.84)), 1px); }   /* logo mieści się obok pola Grid */
    /* nagłówek w dwóch liniach: nazwa | grid, filtry | kompas */
    header.top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
    header.top > .brand { display: contents; }
    .list { margin-top: 0; }   /* lista zaczyna się tuż pod linią nagłówka */
    header.top h1 { grid-column: 1; }
    header.top .where { grid-column: 2; margin: 0; white-space: nowrap; }
    .controls { grid-column: 1 / -1; width: 100%; column-gap: 12px; }
    .elrow { order: 3; width: 100%; }          /* telefon: suwak na całą szerokość, pod filtrami */
    #minel { flex: 1; width: auto; }
    .morebtn { max-width: none; }
    #compasswrap { margin-left: auto; white-space: nowrap; }
    @media (max-width: 350px) { .controls { column-gap: 8px; } }
    .cols { display: none; }
    .row {
      grid-template-columns: auto 1fr auto;
      grid-template-areas:
        "mode name eta"
        "info info info";
      row-gap: 2px; padding: 11px 20px 10px 20px;   /* treść 20 px od krawędzi ekranu */
    }
    .row .mode { grid-area: mode; align-self: start; margin-top: 1px; }   /* wyrównanie do pierwszej linii nazwy, także gdy pod nią jest pozycja na żywo */
    .row .name { grid-area: name; }
    .row .eta  { grid-area: eta; }
    /* (dawniej: wszystkie pola w obszarze info – teraz siatka kolumn wewnątrz .info) */
    /* dolna linijka w stałych kolumnach: czas trwania i elewacja zaczynają się w tym samym miejscu w każdym wierszu, trasa azymutu do prawej */
    .row .info { grid-area: info; display: grid; grid-template-columns: 25% 20.3% 1fr auto; align-items: baseline; color: var(--muted); font-size: 14px; line-height: 20px; white-space: nowrap; }
    .row .info > * { text-align: left; justify-self: start; }
    .row .info .az { justify-self: end; text-align: right; }
    .row .info .el b { font-weight: inherit; color: inherit; }
    .det-in { padding: 4px 20px 14px; }
    .tle { margin-top: 19px; }
    figure.plot .level { --lv-top: 16px; }   /* poziomica: odstęp od góry panelu = odstęp od prawej krawędzi */   /* odstęp tekst → linia TLE = odstęp godziny → „Downlink” (mierzony od liter) */
    .det-grid { grid-template-columns: 1fr; }
    .tools-top { display: none; }
    .theme-m { display: inline-flex; margin-left: -6px; }
    .lang-foot { display: inline-flex; margin-right: -6px; }
    .det-grid figure.plot { order: -1; }
    svg.polar { max-width: none; width: 100%; margin: 8px auto 0; }   /* odstęp do „N” u góry = odstęp do „W”/„E” po bokach */
    svg.polar text { font-size: 9.5px; }
    svg.polar .card { font-size: 12px; }
    .times { gap: 4px 22px; }
    .times div em { display: block; margin-left: 0; }
    .times { display: flex; justify-content: space-between; width: calc(100% + 1px); margin-right: -1px; }   /* -1px: korekta optyczna prawej krawędzi cyfr i liter */
    .times div:nth-of-type(2) { text-align: center; }
    .times div:nth-of-type(3) { text-align: right; }
    /* trasa azymutu: strzałki tak blisko liczb jak w „az →321°” */
    .row .az .parr { word-spacing: -1ch; margin: 0 2px 0 1px; }   /* odstęp od liter ok. 3,5 px z obu stron */
    /* strzałki AOS → Max → LOS na wysokości godzin, jak w linijce azymutów */
    .tarrow { display: block; padding-top: 18px; line-height: 27px; font-size: 16px; color: var(--muted); }
  }
  @media (max-width: 350px) { .row .info { font-size: 12px; line-height: 20px; } }   /* bardzo wąskie telefony: dolna linijka nadal w jednym wierszu */
  @media (min-width: 721px) {
    figure.plot { margin-top: 5px; }   /* komputer: równy odstęp nad „N” i pod „S” (do linii TLE) */
    .tle { margin-top: 10px; }
    .row .info { display: contents; }
  }
</style>

const HOURS_AHEAD = 24;          // ile godzin do przodu liczyć przeloty
const MIN_PEAK_EL = 1;           // pomijaj przeloty niższe niż tyle stopni
const TLE_URLS = [
  'https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=tle',
  'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=tle',
  'https://www.amsat.org/tle/current/nasabare.txt',
];
const TLE_MAX_AGE = 24 * 3600 * 1000;

// ---------- pamięć przeglądarki (bezpiecznie) ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ---------- lokator → współrzędne ----------
function gridToLatLon(grid) {
  const g = grid.toUpperCase();
  if (!/^[A-R]{2}[0-9]{2}([A-X]{2})?$/.test(g)) return null;
  let lon = (g.charCodeAt(0) - 65) * 20 + (+g[2]) * 2 - 180;
  let lat = (g.charCodeAt(1) - 65) * 10 + (+g[3]) - 90;
  if (g.length === 6) {
    lon += (g.charCodeAt(4) - 65) * 5 / 60 + 2.5 / 60;
    lat += (g.charCodeAt(5) - 65) * 2.5 / 60 + 1.25 / 60;
  } else { lon += 1; lat += 0.5; }
  return { lat, lon };
}

// współrzędne → lokator 6-znakowy (np. 52.10, 21.21 → KO02OC)
function latLonToGrid(lat, lon) {
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWX';
  lon = Math.min(179.9999, Math.max(-180, lon)) + 180; lat = Math.min(89.9999, Math.max(-90, lat)) + 90;
  return L[Math.floor(lon / 20)] + L[Math.floor(lat / 10)] + Math.floor((lon % 20) / 2) + Math.floor(lat % 10) +
         L[Math.floor((lon % 2) * 12)] + L[Math.floor((lat % 1) * 24)];
}

// ---------- TLE ----------
function parseTLE(text) {
  const lines = text.split(/\r?\n/).map(l => l.trimEnd()).filter(l => l.trim());
  const out = {};
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith('1 ') && lines[i + 1] && lines[i + 1].startsWith('2 ')) {
      const name = (i > 0 && !lines[i - 1].startsWith('1 ') && !lines[i - 1].startsWith('2 ')) ? lines[i - 1].trim() : '';
      const norad = parseInt(lines[i].substring(2, 7), 10);
      const ep = parseFloat(lines[i].substring(18, 32)) || 0;
      const epoch = (ep >= 57000 ? 1900000 : 2000000) + ep;   // RRDDD.ddd → porównywalna liczba
      if (!out[norad] || out[norad].epoch < epoch) out[norad] = { name, l1: lines[i], l2: lines[i + 1], epoch };
      i++;
    }
  }
  return out;
}

async function fetchTLE() {
  // wszystkie źródła naraz (równolegle), żeby dane były gotowe jak najszybciej
  const parts = await Promise.all(TLE_URLS.map(async url => {
    try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? await r.text() : ''; } catch (e) { return ''; }
  }));
  let text = '\n' + parts.join('\n');
  // satelity, których nie ma w plikach zbiorczych – dociągnij pojedynczo z CelesTrak po numerze NORAD
  const have = parseTLE(text);
  const missing = SATS.filter(s => !have[s.norad]).map(s => s.norad);
  await Promise.all(missing.map(async n => {
    try {
      const r = await fetch(`https://celestrak.org/NORAD/elements/gp.php?CATNR=${n}&FORMAT=tle`, { cache: 'no-store' });
      if (r.ok) text += '\n' + await r.text();
    } catch (e) {}
  }));
  if (Object.keys(parseTLE(text)).length === 0) throw new Error('brak danych');
  store.set('tle_text', text);
  store.set('tle_time', String(Date.now()));
  return text;
}

// ---------- obliczenia orbitalne ----------
let observer = null;   // {latitude, longitude (rad), height km}

function lookAngles(satrec, date) {
  const pv = satellite.propagate(satrec, date);
  if (!pv || !pv.position || typeof pv.position === 'boolean') return null;
  const gmst = satellite.gstime(date);
  const ecf = satellite.eciToEcf(pv.position, gmst);
  const la = satellite.ecfToLookAngles(observer, ecf);
  return { el: la.elevation * 180 / Math.PI, az: (la.azimuth * 180 / Math.PI + 360) % 360 };
}

function elAt(satrec, t) { const a = lookAngles(satrec, new Date(t)); return a ? a.el : -90; }

function refineCrossing(satrec, t0, t1) {     // el(t0) < 0 <= el(t1) lub odwrotnie
  const up = elAt(satrec, t0) < 0;
  for (let i = 0; i < 20 && t1 - t0 > 1000; i++) {
    const m = (t0 + t1) / 2;
    if ((elAt(satrec, m) < 0) === up) t0 = m; else t1 = m;
  }
  return t1;
}

function findPasses(sat, satrec, from, to) {
  const step = 30 * 1000;
  const passes = [];
  let prev = elAt(satrec, from);
  let start = null;
  if (prev >= 0) {            // satelita już jest nad horyzontem – znajdź prawdziwy wschód
    let b = from;
    while (b > from - 3600 * 1000 && elAt(satrec, b - step) >= 0) b -= step;
    start = elAt(satrec, b - step) < 0 ? refineCrossing(satrec, b - step, b) : b;
  }
  for (let t = from + step; t <= to + 3 * 3600 * 1000; t += step) {
    const el = elAt(satrec, t);
    if (prev < 0 && el >= 0) {
      if (t - step > to) break;
      start = refineCrossing(satrec, t - step, t);
    } else if (prev >= 0 && el < 0 && start !== null) {
      const end = refineCrossing(satrec, t - step, t);
      passes.push(buildPass(sat, satrec, start, end));
      start = null;
    }
    prev = el;
  }
  return passes.filter(p => p.elMax >= MIN_PEAK_EL);
}

function buildPass(sat, satrec, start, end) {
  let peakT = start, peakEl = -90;
  for (let t = start; t <= end; t += 5000) {
    const el = elAt(satrec, t);
    if (el > peakEl) { peakEl = el; peakT = t; }
  }
  const az = t => Math.round(lookAngles(satrec, new Date(t)).az);
  const azRise = az(start), azSet = az(end);
  const d = azSet - azRise;
  return {
    sat, start, end, peak: peakT,
    elMax: Math.round(peakEl),
    azRise, azPeak: az(peakT), azSet,
    right: (d > 0 && d < 180) || d < -180,
  };
}

  s += `<g class="rot" transform="rotate(${f(plotRot)} ${PC} ${PC})">`;
  s += `<line class="grid" x1="${PC}" y1="${PC - PR}" x2="${PC}" y2="${PC + PR}"/><line class="grid" x1="${PC - PR}" y1="${PC}" x2="${PC + PR}" y2="${PC}"/>`;
  s += `</g>`;

  }

    const a = az * Math.PI / 180, rr = PR + 11, x = PC + rr * Math.sin(a), y = PC - rr * Math.cos(a);
    s += `<text class="card cr" x="${f(x)}" y="${f(y)}" text-anchor="middle" dominant-baseline="central"${cr(x, y)}>${lbl}</text>`;
  }

       `<g class="nm" transform="rotate(${f(-plotRot)})"><text class="satname" x="0" y="-12" text-anchor="middle">${esc(p.sat.name)}</text></g></g>`;
  s += `</g>`;

    if (m < NMAX) P[m][m + 1] = s * (2 * m + 1) * pmm;
    for (let n = m + 2; n <= NMAX; n++) P[m][n] = ((2 * n - 1) * s * P[m][n - 1] - (n + m - 1) * P[m][n - 2]) / (n - m);

  const fact = n => { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; };
  let X = 0, Y = 0, Z = 0;
  for (let n = 1; n <= NMAX; n++) {
    const ar = Math.pow(RE / r, n + 2);
    for (let m = 0; m <= n; m++) {

  const inner = det.querySelector('.det-in');
  e.fill = () => { inner.innerHTML = detailsHTML(e.p); const s = inner.querySelector('svg.polar'); s._pass = e.p; s._g = null; det._lang = lang; det._narrow = isNarrow(); setPlotRotation(); };
  const open = openRows.has(id);
  row.setAttribute('aria-expanded', String(open));
  det.inert = !open;
  if (open) { e.fill(); det.classList.add('open'); }
  const toggle = () => {
    const willOpen = !det.classList.contains('open');
    row.setAttribute('aria-expanded', String(willOpen));
    det.inert = !willOpen;
    if (willOpen) {
      openRows.add(id);
      if (!inner.firstChild || det._lang !== lang || det._p !== e.p) { e.fill(); det._p = e.p; }
      void det.offsetHeight;                    // wymuś układ, żeby animacja ruszyła od zera
      det.classList.add('open');
      updatePlots();                            // pozycja satelity od razu, bez czekania na zegar
    } else {
      openRows.delete(id);
      det.classList.remove('open');
      syncPulse(row);                           // puls wraca we właściwej fazie
    }
  };
  row.addEventListener('click', toggle);
  row.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
  return e;
}

function renderRow(e, now) {
  const on = now >= e.p.start;
  const turningOn = e.row._on === false && on;   // przelot właśnie się zaczął – etykieta płynnie ciemnieje
  if (!turningOn) e.row.classList.toggle('on', on);
  e.row.innerHTML = rowHTML(e.p, now);
  placeEta(e.row);
  if (turningOn) {
    void e.row.offsetWidth; e.row.classList.add('on');
    const st = e.row.querySelector('.start');   // ↑ AOS → ↓ LOS: nowa godzina płynnie się pojawia
    if (st && !reduceMotion()) st.animate([{ opacity: 0, transform: 'translateY(-3px)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2, .7, .2, 1)' });
  }
  e.row._on = on; e.row._lang = lang; e.row._narrow = isNarrow();
}

// znikanie: wiersz (i otwarte szczegóły) płynnie się zwija i wygasa
// Animacje listy techniką FLIP: tylko przezroczystość i przesunięcie (transform) – bez animowania wysokości,
// więc przeglądarka nie przelicza układu strony w każdej klatce i nic się nie przycina na telefonie.
// Znikanie: wiersz zostaje „w powietrzu” w swoim miejscu (poza układem) i wygasa.
function animateOut(els) {
  const list = $('list'), lb = list.getBoundingClientRect();
  const items = els.filter(el => el && el.isConnected).map(el => ({ el, r: el.getBoundingClientRect() }));   // najpierw pomiar wszystkich
  for (const { el, r } of items) {
    el.inert = true;
    el.classList.add('leaving');
    if (reduceMotion() || r.height < 1) { el.remove(); continue; }
    Object.assign(el.style, { position: 'absolute', left: `${r.left - lb.left}px`, top: `${r.top - lb.top}px`, width: `${r.width}px`, height: `${r.height}px`, margin: '0', zIndex: '0' });
    const a = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-out', fill: 'forwards' });
    a.onfinish = () => el.remove();
  }
}
// Pojawianie: łagodne rozjaśnienie z lekkim wjazdem od góry.
function animateIn(el, delay = 0) {
  if (reduceMotion()) return;
  el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 360, easing: 'ease-out', delay, fill: 'backwards' });
}
// Przesunięcie: elementy, które zmieniły miejsce, płynnie dojeżdżają z poprzedniej pozycji do nowej.
function flipFrom(before, delay = 0) {
  if (reduceMotion()) return;
  for (const [el, top] of before) {
    if (!el.isConnected || el.classList.contains('leaving')) continue;
    const dy = top - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 0.5) continue;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 420, delay, easing: EASE, composite: 'add', fill: 'backwards' });
  }
}

function draw() {
  const now = Date.now();
  passes = passes.filter(p => p.end > now);
  const list = $('list');
  const matching = satrecs.length ? passes.filter(p => filter[p.sat.mode] !== false && p.elMax >= minEl) : [];
  // liczone przy każdym rysowaniu, więc po zmianie szerokości okna lista sama się dopasowuje
  const shown = matching.slice(0, firstPage() + extraPages * pageStep());
  updateMore(matching.length, shown.length, matching[shown.length]);
  if (!shown.length) {
    rowEls.clear();
    list.innerHTML = `<p class="empty${tleLoading && !satrecs.length ? ' loading' : ''}">${T(satrecs.length ? 'noPasses' : (tleLoading ? 'tleLoading' : 'noTLE'))}</p>`;
    return;
  }
  const first = !list.querySelector('.cols');
  let head = list.querySelector('.cols');
  if (!head) {
    list.innerHTML = '';
    head = document.createElement('div');
    head.className = 'cols'; head.setAttribute('aria-hidden', 'true');
    list.appendChild(head);
  }
  if (head._lang !== lang) {
    head.innerHTML = `<span>${T('colMode')}</span><span>${T('colSat')}</span><span>${T('colRise')}</span><span class="r">${T('colDur')}</span><span class="r">${T('colEta')}</span><span class="r">${T('colMax')}</span><span class="r">${T('colAz')}</span>`;
    head._lang = lang;
  }

  // FLIP: zapamiętaj położenie wierszy i elementów pod listą przed zmianą
  const before = new Map();
  if (!first) {
    for (const e of rowEls.values()) { before.set(e.row, e.row.getBoundingClientRect().top); before.set(e.det, e.det.getBoundingClientRect().top); }
    for (const el of [$('more'), document.querySelector('footer.data')]) if (el && !el.hidden) before.set(el, el.getBoundingClientRect().top);
  }

  // dopasuj przeliczone przeloty do istniejących wierszy (ten sam satelita, wschód różni się < 1 min)
  const idOf = new Map();
  for (const p of shown) {
    let id = passId(p);
    if (!rowEls.has(id)) {
      for (const [oid, e] of rowEls) {
        if (e.p.sat === p.sat && Math.abs(e.p.start - p.start) < 60000 && ![...idOf.values()].includes(oid)) { id = oid; break; }
      }
    }
    idOf.set(p, id);
  }
  const ids = new Set(idOf.values());
  const leaving = [];
  for (const [id, e] of rowEls) {
    if (!ids.has(id)) { leaving.push(e.row, e.det); rowEls.delete(id); before.delete(e.row); before.delete(e.det); openRows.delete(id); }   // po powrocie (np. filtr) wiersz wraca zwinięty
  }
  if (leaving.length) animateOut(leaving);

  const activeCount = shown.filter(p => now >= p.start).length || 1;
  let activeIdx = 0, prev = head;
  const entered = [];
  for (const p of shown) {
    const id = idOf.get(p);
    let e = rowEls.get(id);
    const isNew = !e;
    if (isNew) { e = makeEntry(p, id); rowEls.set(id, e); }
    else if (e.p !== p) { e.p = p; e.det._p = null; }
    const on = now >= p.start;
    if (isNew || e.row._on !== on || e.row._lang !== lang || e.row._narrow !== isNarrow()) renderRow(e, now);
    if (e.det.classList.contains('open') && (e.det._lang !== lang || e.det._narrow !== isNarrow())) e.fill();
    if (on) {
      const shift = Math.round(activeIdx++ * PULSE_CYCLE / activeCount);
      if (e.row._shift !== shift || !e.row.style.animationDelay) { e.row._shift = shift; restartPulse(e.row); }
    }
    // ustaw kolejność w DOM bez przebudowy (pomijając wiersze, które właśnie znikają)
    let next = prev.nextSibling;
    while (next && next.classList && next.classList.contains('leaving')) next = next.nextSibling;
    if (next !== e.row) list.insertBefore(e.row, next);
    if (e.row.nextSibling !== e.det) list.insertBefore(e.det, e.row.nextSibling);
    prev = e.det;
    if (isNew && !first) entered.push(e.row);
  }
  // kolejność: najpierw znikające wygasają, potem reszta przesuwa się na nowe miejsca, na końcu pojawiają się nowe
  const gap = leaving.length ? 140 : 0;
  flipFrom(before, gap);
  // nowe wiersze pojawiają się dopiero, gdy pozostałe zrobiły już dla nich miejsce – nic na siebie nie nachodzi
  const moved = [...before.keys()].some(el => el.isConnected);
  // start, gdy przesuwane wiersze przebyły już większość drogi (krzywa EASE: ~70% po 170 ms) – bez pustej „dziury” i bez nachodzenia
  entered.forEach((el, i) => animateIn(el, gap + (moved ? 170 : 0) + Math.min(i, 12) * 30));
  updateEtas(now);
  updatePositions();
  updatePlots();
}

// co sekundę: odliczanie „za …”; jeśli przelot się zaczął albo skończył – odśwież listę
// licznik w przycisku – jak licznik mechaniczny: przewija się tylko cyfra, która się zmienia
function setMoreNum(n) {
  const s = pad2(n);
  $('morebtn').querySelectorAll('.mb-d').forEach((d, i) => d.replaceChildren(Object.assign(document.createElement('span'), { textContent: s[i] })));
}
function rollDigit(slot, ch, DUR) {
  const old = slot.lastElementChild;
  if (old && old.textContent === ch) return;
  const el = Object.assign(document.createElement('span'), { textContent: ch });
  slot.appendChild(el);
  el.animate([{ transform: 'translateY(-90%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: DUR, easing: 'cubic-bezier(.2, .7, .2, 1)' });
  if (old) old.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(90%)', opacity: 0 }], { duration: DUR, easing: 'cubic-bezier(.4, 0, .6, 1)', fill: 'forwards' }).onfinish = () => old.remove();
}
function countUp() {
  const btn = $('morebtn'), n = btn._n;
  if (!n || $('more').hidden || document.hidden || reduceMotion() || btn._counting) return;
  btn._counting = true;
  const STEP = 150, DUR = 420;
  const slots = btn.querySelectorAll('.mb-d');
  for (let k = 1; k <= n; k++) setTimeout(() => {
    const s = pad2(btn._n === n ? k : btn._n);
    slots.forEach((d, i) => rollDigit(d, s[i], DUR));
    if (k === n) setTimeout(() => { btn._counting = false; }, DUR);
  }, (k - 1) * STEP);
}

const PEEK_ON = false;   // odkrywanie kolejnego przelotu pod przyciskiem (wyłączone)
function updateMore(total, visible, next) {
  const box = $('more');
  const left = total - visible;
  box.hidden = left <= 0;
  // podgląd kolejnego przelotu pod przyciskiem
  const peek = $('peek');
  const key = next ? `${next.sat.name}|${next.start}|${lang}|${isNarrow()}|${Math.floor(Date.now() / 60000)}` : '';   // co minutę świeży czas
  if (PEEK_ON && peek._key !== key) {
    peek._key = key;
    peek.innerHTML = '';
    if (next) {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = rowHTML(next, Date.now());
      peek.appendChild(r); placeEta(r);
      // zmierz, gdzie zaczyna się etykieta trybu w ukrytym wierszu – przycisk stanie dokładnie na jej wysokości
      requestAnimationFrame(() => { const tag = r.querySelector('.mode'); if (tag) box.style.setProperty('--tagoff', `${(tag.getBoundingClientRect().top - r.getBoundingClientRect().top).toFixed(2)}px`); });
    }
  }
  if (left > 0) {
    const n = Math.min(pageStep(), left), btn = $('morebtn');
    btn.querySelector('.mb-label').textContent = T('showMoreLbl');
    btn.querySelector('.mb-unit').textContent = T('passUnit')(n);
    btn.setAttribute('aria-label', T('showMore')(n));
    if (btn._n !== n) { btn._n = n; setMoreNum(n); }
  }
}

function updateEtas(now) {
  for (const e of rowEls.values()) {
    if (now >= e.p.start) {   // pasek postępu: ile przelotu jeszcze zostało (1 → 0)
      const left = Math.max(0, Math.min(1, (e.p.end - now) / (e.p.end - e.p.start)));
      e.row.style.setProperty('--left', left.toFixed(4));
      continue;
    }
    const el = e.row.querySelector('.eta');
    if (!el) continue;
    const ms = e.p.start - now, parts = etaParts(ms);
    const sec = !!parts.s, hasSec = !!el.querySelector('.es');
    if (sec !== hasSec || (!sec && !el.querySelector('.eh'))) {   // zmiana trybu: 00:01 → 59 – krótkie, ledwo zauważalne przenikanie
      if (el._switching) continue;
      if (reduceMotion() || !el.firstChild) { el.innerHTML = etaHTML(ms); }
      else {
        el._switching = true;
        el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: 'ease-in', fill: 'forwards' }).onfinish = () => {
          el.innerHTML = etaHTML(e.p.start - Date.now());
          el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out', fill: 'forwards' }).onfinish = () => { el._switching = false; };
        };
      }
    }
    else if (sec) { const s = el.querySelector('.es'); if (s.textContent !== parts.s) s.textContent = parts.s; }
    else {                                                     // tylko cyfry – dwukropek pulsuje bez przerwy
      const h = el.querySelector('.eh'), m = el.querySelector('.em');
      if (h.textContent !== parts.h) h.textContent = parts.h;
      if (m.textContent !== parts.m) m.textContent = parts.m;
    }
    el.title = `${T('toRise')}: ${T('in')} ${etaShort(ms)}`;
  }
}
function tick() {
  const now = Date.now();
  for (const e of rowEls.values()) {
    if (e.p.end <= now || (now >= e.p.start) !== e.row._on) { draw(); return; }
  }
  updateEtas(now);
}

function updatePositions() {
  const now = Date.now();
  for (const el of document.querySelectorAll('.livepos')) {
    let txt = null;
    if (+el.dataset.start <= now && +el.dataset.end >= now) {
      const r = satrecs.find(x => x.sat.name === el.dataset.sat);
      const a = r && lookAngles(r.satrec, new Date(now));
      const b = r && lookAngles(r.satrec, new Date(now + 10000));
      if (a && b && a.el >= 0) {
        const daz = ((b.az - a.az + 540) % 360) - 180;   // poprawnie także przy przejściu 359° → 0°
        txt = `el <span class="earr vert">${b.el > a.el ? '↑' : '↓'}</span>${Math.round(a.el)}°  az <span class="earr">${daz >= 0 ? '→' : '←'}</span>${Math.round(a.az)}°`;
      }   // strzałka tuż przy elewacji – wiadomo, czego dotyczy
    }
    if (txt) {
      if (el._txt !== txt) { el.innerHTML = txt; el._txt = txt; }
      if (!el.classList.contains('show')) { void el.offsetHeight; el.classList.add('show'); }   // wjeżdża płynnie
    } else {
      el.classList.remove('show');            // tekst zostaje do końca wygaszania, więc nie „znika na sztywno”
    }
  }
}

function calculate() {
  const ll = gridToLatLon(locator);
  if (!ll) { $('list').innerHTML = ''; rowEls.clear(); return; }   // najpierw grid (ekran powitalny)
  observer = { latitude: ll.lat * Math.PI / 180, longitude: ll.lon * Math.PI / 180, height: 0.1 };
  satrecs = [];
  const missing = [];
  for (const sat of SATS) {
    const t = tleDB[sat.norad];
    if (!t) { missing.push(sat.name); continue; }
    try {
      const satrec = satellite.twoline2satrec(t.l1, t.l2);
      const epoch = (satrec.jdsatepoch - 2440587.5) * 86400000;
      satrecs.push({ sat, satrec, tleName: t.name, epoch });
    } catch (e) { missing.push(sat.name); }
  }
  const now = Date.now();
  const to = now + HOURS_AHEAD * 3600 * 1000;
  passes = [];
  for (const r of satrecs) {
    try { passes.push(...findPasses(r.sat, r.satrec, now, to)); } catch (e) {}
  }
  passes.sort((a, b) => a.start - b.start);
  lastCalc = now;

  const tt = +store.get('tle_time');
  $('tleinfo').textContent = tt ? `${T('tleFrom')} ${new Date(tt).toLocaleString(T('locale'), { dateStyle: 'medium', timeStyle: 'short' })}` : T('tleNone');
  const haveTLE = Object.keys(tleDB).length > 0;
  $('satlist').innerHTML = SATS.map(s => {
    const miss = haveTLE && missing.includes(s.name);
    return `<a href="https://www.n2yo.com/satellite/?s=${s.norad}#results" target="_blank" rel="noopener"` +
           (miss ? ` class="missing" title="${T('missing')}"` : ` title="NORAD ${s.norad}"`) + `>${esc(s.name)}</a>`;
  }).join('');
  setSatlistToggle();
  draw();
}

function setSatlistToggle() {
  const open = $('satreveal').classList.contains('open');
  const b = $('satlist-toggle');
  b.textContent = `${open ? '▾' : '▸'} ${T('satlist')} (${SATS.length})`;
  b.setAttribute('aria-expanded', String(open));
}

function setLocatorUI() {
  $('loc').textContent = locator || '—';
  snapBox($('loc'));
  for (const b of document.querySelectorAll('.flt')) b.setAttribute('aria-pressed', String(!!filter[b.dataset.m]));
}

async function loadTLE(force) {
  const cached = store.get('tle_text');
  const age = Date.now() - (+store.get('tle_time') || 0);
  let text = (!force && cached && age < TLE_MAX_AGE) ? cached : null;
  if (!text) {
    $('tleinfo').textContent = T('tleLoading');
    tleLoading = true;
    if (locator && !satrecs.length) draw();      // pokaż „pobieram…” zamiast „brak danych”
    try { text = await fetchTLE(); $('tlefail').hidden = true; }
    catch (e) {
      text = cached;   // użyj starych danych, jeśli są
      $('tlefail').hidden = false;
    }
  }
  tleLoading = false;
  tleDB = text ? parseTLE(text) : {};
  calculate();
}

// ---------- cytaty na ekranie powitalnym (płynna rotacja) ----------
// „|” = miejsce złamania linii (jak w projekcie); autor zawsze w jednym kawałku
const QUOTES = [
  { en: 'The sky is very dark; the Earth is|bluish.', who: 'Yuri Gagarin' },
  { en: 'We choose to go to the Moon.', who: 'John F. Kennedy', br: true },
  { en: 'The Eagle has landed.', who: 'Neil Armstrong', br: true },
  { en: 'Houston, we’ve had a problem|here.', who: 'Jack Swigert' },
  { en: 'After all, it’s a radio station,|not a tank.', pl: 'A przecież to radiostacja,|nie czołg.', who: 'Antoni Zębik SP7LA' },
  { en: 'Have I done the world good, or|have I added a menace?', who: 'Marconi' },
];
let qIdx = Math.floor(Math.random() * QUOTES.length), qTimer = 0, qBusy = false;
const quoteHTML = q => `<span class="wq-q">${esc((lang === 'pl' && q.pl) || q.en).replace('|', '<br>')}</span> –${q.br ? '<br>' : ' '}<cite>${esc(q.who)}</cite>`;
// stała wysokość pola cytatu = najdłuższy cytat przy tej szerokości i języku, żeby nic pod nim nie „skakało”
function sizeQuote() {
  const box = $('wQuote'), bq = box.querySelector('blockquote');
  const probe = bq.cloneNode(); probe.style.cssText = 'position:absolute;visibility:hidden;left:0;right:0;top:0';
  box.appendChild(probe);
  let h = 0;
  for (const q of QUOTES) { probe.innerHTML = quoteHTML(q); h = Math.max(h, probe.getBoundingClientRect().height); }
  probe.remove();
  box.style.minHeight = `${Math.ceil(h)}px`;
}
function showQuote(animate) {
  const bq = $('wQuote').querySelector('blockquote');
  const html = quoteHTML(QUOTES[qIdx]);
  if (!animate || reduceMotion()) { bq.innerHTML = html; return; }
  qBusy = true;
  // wyjście: lekko w górę, rozmycie i wygaszenie; wejście: od dołu, z rozmycia do ostrości
  bq.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(-8px)', filter: 'blur(3px)' }],
             { duration: 550, easing: 'cubic-bezier(.4, 0, 1, 1)', fill: 'forwards' }).onfinish = () => {
    bq.innerHTML = html;
    bq.animate([{ opacity: 0, transform: 'translateY(8px)', filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
               { duration: 750, easing: 'cubic-bezier(0, 0, .2, 1)', fill: 'forwards' }).onfinish = () => { qBusy = false; };
  };
}
function startQuotes() {
  // przy każdym otwarciu losowy cytat (inny niż poprzednio pokazany)
  let n = Math.floor(Math.random() * QUOTES.length);
  if (n === qIdx) n = (n + 1 + Math.floor(Math.random() * (QUOTES.length - 1))) % QUOTES.length;
  qIdx = n;
  sizeQuote(); showQuote(false);
  clearInterval(qTimer);
  qTimer = setInterval(() => {
    if ($('welcome').hidden || document.hidden || qBusy) return;
    qIdx = (qIdx + 1) % QUOTES.length; showQuote(true);
  }, 5000);   // co 5 s nowy cytat
}

// ---------- ekran powitalny / zmiana gridu ----------
function setHint(txt, err) { const h = $('wHint'); h.textContent = txt; h.classList.toggle('err', !!err); }
function openWelcome(fromHeader) {
  const w = $('welcome'), inp = $('wGrid');
  inp.value = locator || '';
  $('wClose').hidden = !locator;
  setHint(T('wHint'));
  w.hidden = false;
  document.body.style.overflow = 'hidden';
  startQuotes();
  requestAnimationFrame(() => { snapStatic(); snapWelcome(); });
  if (!reduceMotion()) w.animate([{ opacity: 0 }, { opacity: 1 }], { duration: fromHeader ? 250 : 400, easing: 'ease-out' });
  // pole aktywne od razu tylko z myszką i klawiaturą; na telefonie nie, żeby klawiatura nie zasłaniała ekranu
  if (!isNarrow() && matchMedia('(pointer: fine)').matches) setTimeout(() => { inp.focus(); inp.select(); }, 60);
}
function closeWelcome() {
  const w = $('welcome');
  document.body.style.overflow = '';
  if (reduceMotion()) { w.hidden = true; return; }
  w.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, easing: 'ease-in' }).onfinish = () => { w.hidden = true; };
}
function setupWelcome() {
  const inp = $('wGrid');
  inp.addEventListener('input', () => {                  // tylko litery i cyfry, wielkie, maks. 6 znaków
    const v = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    if (inp.value !== v) inp.value = v;
    setHint(T('wHint'));
  });
  const go = () => {
    const v = inp.value.trim().toUpperCase();
    if (!gridToLatLon(v)) { setHint(T(v ? 'wBad' : 'wNeed'), true); inp.focus(); return; }
    const changed = v !== locator;
    locator = v; store.set('locator', locator);
    compassCorr = declinationHere();
    setLocatorUI();
    closeWelcome();
    if (changed) calculate();
  };
  $('wGo').addEventListener('click', go);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  // zamknięcie (× lub Esc) tylko z poprawnym gridem w polu – bez gridu albo z błędnym ekran zostaje otwarty
  const tryClose = () => { if (locator) go(); };
  $('wClose').addEventListener('click', tryClose);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('welcome').hidden) tryClose(); });
  $('wGps').addEventListener('click', () => {
    if (!('geolocation' in navigator)) { setHint(T('wNoGps'), true); return; }
    const b = $('wGps'); b.disabled = true; setHint(T('wLocating'));
    navigator.geolocation.getCurrentPosition(pos => {
      b.disabled = false;
      inp.value = latLonToGrid(pos.coords.latitude, pos.coords.longitude);
      setHint(T('wFound')(inp.value));
      $('wGo').focus();
    }, err => {
      b.disabled = false;
      setHint(T(err && err.code === 1 ? 'wDenied' : 'wNoGps'), true);
    }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60 * 1000 });
  });
}

// ---------- pixel grid: elementy z obramowaniem mają całkowitą szerokość (tekst daje ułamki, np. 37,4 px),
// a wyśrodkowane – parzystość dopasowaną do rodzica, więc krawędzie i linie wypadają dokładnie na pikselach ----------
function snapBox(el, centered = false) {
  if (!el || !el.isConnected) return;
  el.style.width = '';
  const w = el.getBoundingClientRect().width;
  if (!w) return;
  let iw = Math.ceil(w - 0.01);
  if (centered && el.parentElement) {
    const pw = Math.round(el.parentElement.getBoundingClientRect().width);
    if ((pw - iw) % 2) iw += 1;
  }
  if (Math.abs(iw - w) > 0.01) el.style.width = `${iw}px`;
}
function snapWelcome() {
  const w = $('welcome'); if (!w || w.hidden) return;
  const card = w.querySelector('.w-card'), top = w.querySelector('.w-top');
  card.style.marginTop = ''; card.style.marginBottom = '';
  const mt = card.getBoundingClientRect().top - top.getBoundingClientRect().bottom;
  if (Math.abs(mt - Math.round(mt)) > 0.01) { card.style.marginTop = `${Math.floor(mt)}px`; card.style.marginBottom = 'auto'; }
  w.querySelectorAll('.w-gps').forEach(el => snapBox(el, true));
}
function snapStatic() {
  document.querySelectorAll('.seg button, .lang button, .actions button, .actions a, .actions label.btn, .theme').forEach(el => snapBox(el));
  document.querySelectorAll('.w-gps, .morebtn').forEach(el => snapBox(el, true));
  snapBox($('loc'));
  // etykiety FM/SSB/DIG: szerokość zmierzona raz na typ i zapisana w stylu (wiersze tworzą się na nowo co chwilę)
  const probe = document.createElement('span'); probe.className = 'mode'; probe.style.cssText = 'position:absolute;visibility:hidden;left:-999px';
  document.body.appendChild(probe);
  let rules = '';
  for (const m of ['FM', 'SSB', 'DIG']) { probe.textContent = m; rules += `.mode[data-m="${m}"]{width:${Math.ceil(probe.getBoundingClientRect().width - 0.01)}px;text-align:center}`; }
  probe.remove();
  let st = document.getElementById('snapcss'); if (!st) { st = document.createElement('style'); st.id = 'snapcss'; document.head.appendChild(st); }
  st.textContent = rules;
}

(function init() {
  const savedLang = store.get('lang');
  lang = savedLang === 'pl' || savedLang === 'en' ? savedLang : 'en';   // domyślnie EN; wybór użytkownika jest zapamiętywany
  applyLang();
  for (const b of document.querySelectorAll('.lang button')) {
    b.addEventListener('click', () => {
      if (lang === b.dataset.lang) return;
      lang = b.dataset.lang;
      store.set('lang', lang);
      applyLang();
      calculate();
    });
  }

  const saved = store.get('locator');
  const savedGrid = store.get('locator');
  locator = savedGrid && gridToLatLon(savedGrid) ? savedGrid.toUpperCase() : '';
  try { const f = JSON.parse(store.get('filter')); if (f) filter = Object.assign(filter, f); } catch (e) {}
  setLocatorUI();

  $('loc').addEventListener('click', () => openWelcome(true));
  setupWelcome();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(snapStatic); else snapStatic();
  if (!locator) openWelcome(false);   // pierwsze wejście: najpierw własny grid

  for (const b of document.querySelectorAll('.flt')) {
    b.addEventListener('click', () => {
      filter[b.dataset.m] = !filter[b.dataset.m];
      store.set('filter', JSON.stringify(filter));
      setLocatorUI();
      draw();
    });
  }
  setupPlotRotation();
  syncThemeUI();
  for (const b of document.querySelectorAll('.theme')) b.addEventListener('click', () => setTheme(isDarkNow() ? 'light' : 'dark'));
  const sl = $('minel');
  const setSliderUI = () => {
    sl.value = String(minEl);
    sl.style.setProperty('--pct', `${(minEl / +sl.max) * 100}%`);
    $('minelv').textContent = `${minEl}°`;
  };
  const savedEl = parseInt(store.get('min_el'), 10);
  if (savedEl >= 0 && savedEl <= 45) minEl = savedEl;
  setSliderUI();
  // pasek gruby przez cały czas trzymania palca/myszy (przeglądarki dotykowe gubią :active przy ruchu)
  const hold = on => sl.classList.toggle('held', on);
  sl.addEventListener('pointerdown', () => hold(true));
  sl.addEventListener('touchstart', () => hold(true), { passive: true });
  for (const ev of ['pointerup', 'pointercancel', 'touchend', 'touchcancel']) window.addEventListener(ev, () => hold(false), { passive: true });
  sl.addEventListener('blur', () => hold(false));
  let elTimer = 0;
  sl.addEventListener('input', () => {
    minEl = +sl.value; setSliderUI();
    clearTimeout(elTimer);
    elTimer = setTimeout(() => { store.set('min_el', String(minEl)); draw(); }, 140);   // lista reaguje płynnie, bez migotania przy przesuwaniu
  });
  $('morebtn').addEventListener('click', () => { extraPages++; draw(); });
  // najechanie / zaznaczenie przycisku: zamiast zamrozić go w połowie ruchu, płynnie wraca na miejsce i czeka
  {
    const more = $('more');
    const hold = () => {
      if (more.classList.contains('hold')) return;
      const cur = getComputedStyle(more).getPropertyValue('--shift');
      more.style.setProperty('--shift', cur);
      more.classList.add('hold');
      void more.offsetWidth;
      more.style.setProperty('--shift', '0px');
    };
    const release = () => {
      if (more.matches(':hover') || more.contains(document.activeElement)) return;
      more.classList.remove('hold'); more.style.removeProperty('--shift');
    };
    more.addEventListener('mouseenter', hold); more.addEventListener('focusin', hold);
    more.addEventListener('mouseleave', release); more.addEventListener('focusout', () => setTimeout(release, 0));
  }
  $('reload').addEventListener('click', () => loadTLE(true));
  $('dltle').addEventListener('click', async e => {
    // spróbuj zapisać plik na dysku; jeśli AMSAT zablokuje, otwórz go w nowej karcie
    e.preventDefault();
    const a = e.currentTarget;
    try {
      const r = await fetch(a.href, { cache: 'no-store' });
      if (!r.ok) throw new Error();
      const url = URL.createObjectURL(await r.blob());
      const tmp = document.createElement('a');
      tmp.href = url; tmp.download = 'nasabare.txt';
      document.body.appendChild(tmp); tmp.click(); tmp.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    } catch (err) {
      window.open(a.href, '_blank', 'noopener');
    }
  });
  $('satreveal').classList.toggle('open', store.get('satlist_open') === '1');
  $('satreveal').inert = !$('satreveal').classList.contains('open');
  $('satlist-toggle').addEventListener('click', () => {
    const open = $('satreveal').classList.toggle('open');
    $('satreveal').inert = !open;
    store.set('satlist_open', open ? '1' : '0');
    setSatlistToggle();
  });
  document.querySelector('label[for=tlefile2]').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('tlefile2').click(); } });
  const onTleFile = async e => {
    const files = [...e.target.files];
    if (!files.length) return;
    const text = (await Promise.all(files.map(f => f.text()))).join('\n');
    if (!Object.keys(parseTLE(text)).length) { alert(T('badFile')); return; }
    const merged = (store.get('tle_text') || '') + '\n' + text;
    store.set('tle_text', merged);
    store.set('tle_time', String(Date.now()));
    $('tlefail').hidden = true;
    e.target.value = '';
    tleDB = parseTLE(merged);
    calculate();
  };
  $('tlefile').addEventListener('change', onTleFile);
  $('tlefile2').addEventListener('change', onTleFile);
  matchMedia('(max-width: 720px)').addEventListener('change', () => draw());
  window.addEventListener('resize', () => { if (!$('welcome').hidden) { sizeQuote(); snapWelcome(); } snapStatic(); });

  loadTLE(false);
  setInterval(() => {
    // przelicz co 30 min; odśwież TLE co 24 h; w międzyczasie tylko odśwież widok
    if (Date.now() - (+store.get('tle_time') || 0) > TLE_MAX_AGE) loadTLE(false);
    else if (Date.now() - lastCalc > 30 * 60 * 1000) calculate();
    else draw();
  }, 15000);
  setInterval(updatePositions, 3000);
  setInterval(updatePlots, 1000);
  setInterval(tick, 1000);
})();
</script>
